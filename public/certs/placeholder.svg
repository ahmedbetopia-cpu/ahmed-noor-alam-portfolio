<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2416" />
      <stop offset="100%" stop-color="#12180e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Badge -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Center Icon: Microsoft / Power Platform Star -->
  <g transform="translate(100, 95) scale(0.9)">
    <!-- Star rays -->
    <path d="M0,-45 L10,-12 L45,0 L10,12 L0,45 L-10,12 L-45,0 L-10,-12 Z" fill="url(#goldGrad)" />
    <!-- Inner diamond -->
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#12180e" stroke="#fbbf24" stroke-width="2" />
  </g>

  <!-- Bottom Ribbon / Text -->
  <rect x="40" y="132" width="120" height="24" rx="6" fill="#f59e0b" />
  <text x="100" y="148" font-family="sans-serif" font-size="11" font-weight="bold" fill="#12180e" text-anchor="middle" letter-spacing="1">CERTIFIED</text>
</svg>
