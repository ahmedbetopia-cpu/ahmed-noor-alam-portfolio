    <!-- Star 3 -->
    <polygon points="76,0 79,8 88,8 81,14 84,22 76,17 68,22 71,14 64,8 73,8" />
    <!-- Star 4 -->
    <polygon points="108,0 111,8 120,8 113,14 116,22 108,17 100,22 103,14 96,8 105,8" />
    <!-- Star 5 -->
    <polygon points="140,0 143,8 152,8 145,14 148,22 140,17 132,22 135,14 128,8 137,8" />
