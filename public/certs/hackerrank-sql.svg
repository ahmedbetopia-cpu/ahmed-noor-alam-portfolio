  <text x="120" y="146" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="26" font-weight="700" fill="#2d3748" text-anchor="middle">Sql</text>

  <!-- 5 Dark Navy Stars (★★★★★) -->
