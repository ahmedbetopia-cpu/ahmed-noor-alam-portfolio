<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="hrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed136" />
      <stop offset="100%" stop-color="#f5b800" />
    </linearGradient>
  </defs>

  <!-- Golden Hexagon Badge (Matching Image 3) -->
  <polygon points="120,12 210,64 210,168 120,220 30,168 30,64" fill="url(#hrGold)" rx="24" />

  <!-- 4-Disk Database Stack Cylinder Icon -->
  <g fill="#2d3748" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round" transform="translate(85, 48)">
    <!-- Disk 1 -->
    <ellipse cx="35" cy="12" rx="32" ry="10" fill="none" stroke-width="4" />
    <!-- Disk 2 -->
    <path d="M3 24 C3 30, 67 30, 67 24" fill="none" stroke-width="4" />
    <!-- Disk 3 -->
    <path d="M3 36 C3 42, 67 42, 67 36" fill="none" stroke-width="4" />
    <!-- Disk 4 -->
    <path d="M3 48 C3 54, 67 54, 67 48" fill="none" stroke-width="4" />
  </g>

