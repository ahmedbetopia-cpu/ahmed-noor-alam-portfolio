<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="lcDarkBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="100%" stop-color="#14161d" />
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Outer Triangular Reuleaux Shield with Metallic Rim -->
  <path d="M120 18 C175 18, 220 85, 205 160 C190 220, 50 220, 35 160 C20 85, 65 18, 120 18 Z" fill="url(#lcDarkBg)" stroke="#383e4a" stroke-width="4" />
  
  <!-- Subtle Inner Ring -->
  <path d="M120 28 C168 28, 208 88, 195 152 C182 208, 58 208, 45 152 C32 88, 72 28, 120 28 Z" fill="none" stroke="#252a34" stroke-width="2" />

  <!-- Glowing Cloud Shape with Cyan Border (Matching Image 2) -->
  <g filter="url(#glowFilter)" transform="translate(60, 68) scale(1.05)">
    <!-- Cloud Path -->
    <path d="M28 60 A22 22 0 0 1 18 20 A30 30 0 0 1 70 8 A26 26 0 0 1 102 24 A22 22 0 0 1 92 60 Z" fill="#182333" stroke="url(#cyanGlow)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- SQL Text inside Cloud -->
    <text x="56" y="44" font-family="'JetBrains Mono', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#00f2fe" text-anchor="middle" letter-spacing="1.5">SQL</text>
  </g>

  <!-- Little Golden Sparkles -->
  <polygon points="175,95 178,102 185,105 178,108 175,115 172,108 165,105 172,102" fill="#ffd166" />
  <polygon points="65,135 67,140 72,142 67,144 65,149 63,144 58,142 63,140" fill="#ffd166" />

  <!-- Bottom Brand Text -->
  <text x="120" y="200" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" fill="#ffa116" text-anchor="middle" letter-spacing="0.5">LeetCode SQL 50</text>
</svg>
