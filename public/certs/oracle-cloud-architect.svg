<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="silverRim2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Metallic Silver Rim Base Stand -->
  <path d="M70 140 L70 190 L130 190 L130 140 Z" fill="#334155" opacity="0.8" />
  
  <!-- Outer Silver Bezel -->
  <circle cx="100" cy="95" r="85" fill="url(#silverRim2)" stroke="#64748b" stroke-width="2" />
  
  <!-- Slate Blue Ring -->
  <circle cx="100" cy="95" r="75" fill="#475569" stroke="#334155" stroke-width="1.5" />
  
  <!-- White Inner Disc -->
  <circle cx="100" cy="95" r="62" fill="#ffffff" />
  
  <!-- Oracle Certified Header -->
  <text x="100" y="58" font-family="sans-serif" font-size="9" font-weight="900" fill="#dc2626" text-anchor="middle" letter-spacing="1">ORACLE</text>
  <text x="100" y="69" font-family="sans-serif" font-size="7" font-weight="500" fill="#64748b" text-anchor="middle">Certified</text>
  
  <!-- Certificate Name -->
  <text x="100" y="90" font-family="sans-serif" font-size="10" font-weight="900" fill="#0f172a" text-anchor="middle">Associate</text>
  
  <!-- Subtitle -->
  <text x="100" y="106" font-family="sans-serif" font-size="6.5" font-weight="600" fill="#334155" text-anchor="middle">Oracle Cloud Infrastructure</text>
  <text x="100" y="117" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0f172a" text-anchor="middle">Architect</text>
  
  <text x="100" y="135" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#64748b" text-anchor="middle">2026</text>
</svg>
